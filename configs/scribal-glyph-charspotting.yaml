# scribal-glyph-charspotting.yaml
# Scribal Glyph Character Spotting
# YOLOv8m by Ultralytics, AGPL-3.0 license
# 512x512 image tiles
#
# 54 classes declared because the COCO category list carries 54 entries.
# Only 31 of them occur anywhere in the tiled data and 29 have instances in the
# evaluation splits, so 23 output heads never see a training example.
#
# Original dataset: https://lme.tf.fau.de/competitions/icdar-2025-competition-on-glyph-detection-in-15th-century-european-printed-documents/
# Example usage: yolo train data=scribal-glyph-charspotting.yaml

